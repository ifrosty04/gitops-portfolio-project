name: Build and Update Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/ifrosty04/gitops-portfolio-project:${{ github.sha }}
            ghcr.io/ifrosty04/gitops-portfolio-project:latest

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: ghcr.io/.*/gitops-portfolio-project:.*|image: ghcr.io/ifrosty04/gitops-portfolio-project:${{ github.sha }}|g" k8s/deployment.yaml
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git push