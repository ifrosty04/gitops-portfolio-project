apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
    spec:
      containers:
      - name: api
        image: ghcr.io/ifrosty04/gitops-portfolio-project:19ddedaf4b4bbb7069f44aea3a908a193b75e033
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "2.0.0"