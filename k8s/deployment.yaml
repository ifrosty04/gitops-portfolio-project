apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
    spec:
      containers:
      - name: api
        image: ghcr.io/ifrosty04/gitops-portfolio-project:f50914d4a57d47f5b93794008cbacf500cf9ea48
        imagePullPolicy: Always
        ports:
        - containerPort: 8080